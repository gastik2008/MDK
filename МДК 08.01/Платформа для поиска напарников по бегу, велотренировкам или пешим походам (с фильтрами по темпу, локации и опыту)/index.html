<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Поиск напарника для спорта</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f5f5f5;
    }
    h1 {
      text-align: center;
    }
    .back-link {
      text-align: center;
      margin-bottom: 15px;
    }
    .partners {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }
    .partner {
      background: #fff;
      border: 1px solid #ddd;
      padding: 12px;
      width: 220px;
      font-size: 14px;
    }
    .partner h3 {
      margin: 0 0 6px;
      font-size: 16px;
    }
    .partner p {
      margin: 4px 0;
    }
    .tag {
      display: inline-block;
      background: #eef2ff;
      color: #4338ca;
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 12px;
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <h1>Найденные напарники</h1>
  <div class="back-link">
    <a href="filters.html">← Вернуться к фильтрам</a>
  </div>

  <div class="partners" id="partnersList"></div>

  <script>
    const partners = [
      {
        name: "Алексей",
        activity: "run",
        location: "moscow",
        pace: "medium",
        experience: "intermediate",
        desc: "Бегаю 3–4 раза в неделю."
      },
      {
        name: "Мария",
        activity: "bike",
        location: "spb",
        pace: "fast",
        experience: "advanced",
        desc: "Люблю длинные заезды."
      },
      {
        name: "Дмитрий",
        activity: "hike",
        location: "kazan",
        pace: "",
        experience: "beginner",
        desc: "Начинающий турист."
      },
      {
        name: "Ольга",
        activity: "run",
        location: "moscow",
        pace: "slow",
        experience: "beginner",
        desc: "Только начала бегать."
      },
      {
        name: "Иван",
        activity: "bike",
        location: "spb",
        pace: "medium",
        experience: "intermediate",
        desc: "Катаюсь по городу."
      }
    ];

    const activityLabels = { run: "Бег", bike: "Велоспорт", hike: "Походы" };
    const locationLabels = { moscow: "Москва", spb: "СПб", kazan: "Казань" };
    const paceLabels = { slow: "Медленный", medium: "Средний", fast: "Быстрый" };
    const experienceLabels = { beginner: "Начинающий", intermediate: "Средний", advanced: "Продвинутый" };

    function getParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        activity: params.get("activity") || "",
        location: params.get("location") || "",
        pace: params.get("pace") || "",
        experience: params.get("experience") || ""
      };
    }

    function render(list) {
      const container = document.getElementById("partnersList");
      container.innerHTML = "";

      if (list.length === 0) {
        container.innerHTML = "<p>Ничего не найдено.</p>";
        return;
      }

      list.forEach(p => {
        const div = document.createElement("div");
        div.className = "partner";

        const tags = [];
        tags.push(`<span class="tag">${activityLabels[p.activity]}</span>`);
        tags.push(`<span class="tag">${locationLabels[p.location]}</span>`);
        if (p.pace) tags.push(`<span class="tag">${paceLabels[p.pace]}</span>`);
        if (p.experience) tags.push(`<span class="tag">${experienceLabels[p.experience]}</span>`);

        div.innerHTML = `
          <h3>${p.name}</h3>
          <p>${p.desc}</p>
          <div>${tags.join(" ")}</div>
        `;
        container.appendChild(div);
      });
    }

    function applyFiltersFromURL() {
      const f = getParams();

      const filtered = partners.filter(p => {
        if (f.activity && p.activity !== f.activity) return false;
        if (f.location && p.location !== f.location) return false;
        if (f.pace && p.pace !== f.pace) return false;
        if (f.experience && p.experience !== f.experience) return false;
        return true;
      });

      render(filtered);
    }

    applyFiltersFromURL();
  </script>
</body>
</html>
