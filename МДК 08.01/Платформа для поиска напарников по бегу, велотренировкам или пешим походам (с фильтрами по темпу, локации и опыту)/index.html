<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Поиск напарника для спорта</h1>

  <div class="filters">
    <label>
      Вид активности
      <select id="activity">
        <option value="">Все</option>
        <option value="run">Бег</option>
        <option value="bike">Велоспорт</option>
        <option value="hike">Пешие походы</option>
      </select>
    </label>

    <label>
      Локация
      <select id="location">
        <option value="">Все города</option>
        <option value="moscow">Москва</option>
        <option value="spb">Санкт-Петербург</option>
        <option value="kazan">Казань</option>
      </select>
    </label>

    <label>
      Темп
      <select id="pace">
        <option value="">Любой</option>
        <option value="slow">Медленный</option>
        <option value="medium">Средний</option>
        <option value="fast">Быстрый</option>
      </select>
    </label>

    <label>
      Опыт
      <select id="experience">
        <option value="">Любой</option>
        <option value="beginner">Начинающий</option>
        <option value="intermediate">Средний</option>
        <option value="advanced">Продвинутый</option>
      </select>
    </label>

    <button id="applyFilters">Применить фильтры</button>
  </div>

  <div class="partners" id="partnersList"></div>

  <script>
    const partners = [
      {
        name: "Алексей",
        activity: "run",
        location: "moscow",
        pace: "medium",
        experience: "intermediate",
        desc: "Бегаю 3–4 раза в неделю."
      },
      {
        name: "Мария",
        activity: "bike",
        location: "spb",
        pace: "fast",
        experience: "advanced",
        desc: "Люблю длинные заезды."
      },
      {
        name: "Дмитрий",
        activity: "hike",
        location: "kazan",
        pace: "",
        experience: "beginner",
        desc: "Начинающий турист."
      },
      {
        name: "Ольга",
        activity: "run",
        location: "moscow",
        pace: "slow",
        experience: "beginner",
        desc: "Только начала бегать."
      },
      {
        name: "Иван",
        activity: "bike",
        location: "spb",
        pace: "medium",
        experience: "intermediate",
        desc: "Катаюсь по городу."
      }
    ];

    const activityLabels = { run: "Бег", bike: "Велоспорт", hike: "Походы" };
    const locationLabels = { moscow: "Москва", spb: "СПб", kazan: "Казань" };
    const paceLabels = { slow: "Медленный", medium: "Средний", fast: "Быстрый" };
    const experienceLabels = { beginner: "Начинающий", intermediate: "Средний", advanced: "Продвинутый" };

    function render(list) {
      const container = document.getElementById("partnersList");
      container.innerHTML = "";

      if (list.length === 0) {
        container.innerHTML = "<p>Ничего не найдено.</p>";
        return;
      }

      list.forEach(p => {
        const div = document.createElement("div");
        div.className = "partner";

        const tags = [];
        tags.push(`<span class="tag">${activityLabels[p.activity]}</span>`);
        tags.push(`<span class="tag">${locationLabels[p.location]}</span>`);
        if (p.pace) tags.push(`<span class="tag">${paceLabels[p.pace]}</span>`);
        if (p.experience) tags.push(`<span class="tag">${experienceLabels[p.experience]}</span>`);

        div.innerHTML = `
          <h3>${p.name}</h3>
          <p>${p.desc}</p>
          <div>${tags.join(" ")}</div>
        `;
        container.appendChild(div);
      });
    }

    function applyFilters() {
      const activity = document.getElementById("activity").value;
      const location = document.getElementById("location").value;
      const pace = document.getElementById("pace").value;
      const experience = document.getElementById("experience").value;

      const filtered = partners.filter(p => {
        if (activity && p.activity !== activity) return false;
        if (location && p.location !== location) return false;
        if (pace && p.pace !== pace) return false;
        if (experience && p.experience !== experience) return false;
        return true;
      });

      render(filtered);
    }

    document.getElementById("applyFilters").addEventListener("click", applyFilters);

    // Показать всех при загрузке
    render(partners);
  </script>
    </header>
</body>
</html>
